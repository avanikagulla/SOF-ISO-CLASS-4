const app=document.getElementById('app');
let active=-1,index=0,answers=[],deadline=0,timer=null,finished=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=i=>'sof-science4-fixed-'+i;
function saved(i){try{return JSON.parse(localStorage.getItem(key(i)))}catch(e){return null}}
function save(){try{localStorage.setItem(key(active),JSON.stringify({answers,finished,deadline}))}catch(e){}}
function home(){clearInterval(timer);active=-1;app.innerHTML='<section class="panel"><h2>Choose a mock test</h2><p>10 practice tests, 35 questions each, with 60 minutes per test. Your answers are saved if browser storage is available.</p><p class="muted">Original practice questions, not reproduced official past papers.</p></section><div class="grid">'+TESTS.map((t,i)=>{let s=saved(i);return '<button class="test" onclick="start('+i+')"><b>Mock Test '+(i+1)+'</b><span class="tag">'+(s?.finished?'Completed':s?'Continue':'Start')+'</span><div>35 questions · 60 minutes</div></button>'}).join('')+'</div>'}
function start(i){clearInterval(timer);active=i;index=0;let s=saved(i);answers=Array.isArray(s?.answers)&&s.answers.length===35?s.answers:Array(35).fill(null);finished=!!s?.finished;deadline=s?.deadline||Date.now()+3600000;if(finished){results();return}if(Date.now()>=deadline){submit(true);return}save();render();timer=setInterval(()=>{if(Date.now()>=deadline)submit(true);else{let el=document.getElementById('clock');if(el)el.textContent=clock()}},1000)}
function clock(){let v=Math.max(0,Math.ceil((deadline-Date.now())/1000));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function choose(n){answers[index]=n;save();render()}
function go(n){index=Math.max(0,Math.min(34,n));render()}
function render(){if(active<0)return;let q=TESTS[active][index],count=answers.filter(x=>x!==null).length;app.innerHTML='<section class="panel"><div class="top"><button class="btn secondary" onclick="home()">← All tests</button><strong>Mock Test '+(active+1)+'</strong><strong id="clock">'+clock()+'</strong></div><p>Question '+(index+1)+' of 35 · '+count+' answered</p><span class="tag">'+esc(q.topic)+'</span><h2>'+esc(q.q)+'</h2>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="choice" '+(answers[index]===j?'checked':'')+' onchange="choose('+j+')"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+'<div class="top" style="margin-top:20px"><button class="btn secondary" onclick="go('+(index-1)+')" '+(index===0?'disabled':'')+'>Previous</button><button class="btn secondary" onclick="go('+(index+1)+')" '+(index===34?'disabled':'')+'>Next</button><button class="btn" onclick="submit(false)">Submit test</button></div><div class="nav">'+answers.map((a,j)=>'<button class="num '+(a!==null?'done ':'')+(j===index?'current':'')+'" onclick="go('+j+')">'+(j+1)+'</button>').join('')+'</div></section>'}
function submit(auto){if(finished)return;let blank=answers.filter(x=>x===null).length;if(!auto&&blank&&!confirm('You have '+blank+' unanswered questions. Submit anyway?'))return;finished=true;save();clearInterval(timer);results()}
function results(){let t=TESTS[active],score=t.reduce((n,q,i)=>n+(answers[i]===q.answer?1:0),0);app.innerHTML='<section class="panel"><button class="btn secondary" onclick="home()">← All tests</button><h2>Mock Test '+(active+1)+' Results</h2><h1>'+score+' / 35</h1><p>'+Math.round(score/35*100)+'% correct</p><button class="btn" onclick="retry()">Try again</button> <button class="btn secondary" onclick="window.print()">Print</button></section><section class="panel"><h2>Answer review</h2>'+t.map((q,i)=>'<div class="review"><strong>'+(i+1)+'. '+esc(q.q)+'</strong><p class="'+(answers[i]===q.answer?'correct':'wrong')+'">Your answer: '+(answers[i]===null?'Not answered':esc(q.options[answers[i]]))+'</p><p><b>Correct:</b> '+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p></div>').join('')+'</section>'}
function retry(){if(confirm('Restart this test?')){try{localStorage.removeItem(key(active))}catch(e){}start(active)}}
home();
</script></body></html>
